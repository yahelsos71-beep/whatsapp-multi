<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>WhatsApp Multi</title>
<style>
  /* 🎨 עיצוב צבעוני (ברירת מחדל) – ומצב כהה ב-body.dark */
  :root {
    --bar: linear-gradient(100deg, #00a884 0%, #0b9c9a 35%, #3f6fe8 75%, #7b5cf0 100%);
    --bg: #eef3f8; --panel: #ffffff; --panel2: #f6f9fc; --text: #10233a; --muted: #5d7186; --line: #e3e9f0;
    --chip: rgba(255,255,255,.18); --chip-h: rgba(255,255,255,.30); --chip-line: rgba(255,255,255,.28);
    --green: #00a884; --green2: #25d366; --shadow: 0 6px 18px rgba(16,35,58,.12);
  }
  body.dark {
    --bar: #202c33; --bg: #111b21; --panel: #202c33; --panel2: #111b21; --text: #e9edef; --muted: #8696a0; --line: #2a3942;
    --chip: #2a3942; --chip-h: #3b4a54; --chip-line: transparent; --shadow: 0 6px 18px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
  #bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--bar); height: 54px; box-shadow: 0 2px 10px rgba(16,35,58,.18); position: relative; z-index: 3; }
  #tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex-shrink: 1; min-width: 0; padding: 2px; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { --c: #00a884; padding: 8px 14px; border-radius: 22px; cursor: pointer; background: var(--chip); color: #fff; border: 1px solid var(--chip-line); user-select: none; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 7px; white-space: nowrap; transition: background .15s, transform .1s; }
  .tab::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px rgba(255,255,255,.75); flex: none; }
  .tab:hover { background: var(--chip-h); }
  .tab.active { background: #fff; color: var(--c); border-color: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.18); }
  .tab.active::before { box-shadow: none; }
  .tab.claude { --c: #d97757; }
  .tab.helpdesk { --c: #5b5bd6; }
  body.dark .tab { color: var(--text); }
  body.dark .tab.active { background: var(--c); color: #fff; border-color: var(--c); }
  .badge { display: none; background: #ff3b5c; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 12px; font-weight: bold; }
  .badge.on { display: inline-block; }
  .tab.active .badge { background: var(--c); color: #fff; }
  body.dark .tab.active .badge { background: #fff; color: var(--c); }
  .spacer { flex: 1; }
  button { background: var(--panel2); color: var(--text); border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 14px; white-space: nowrap; font-family: inherit; }
  button:hover { filter: brightness(.96); }
  #bar button { background: var(--chip); color: #fff; border: 1px solid var(--chip-line); border-radius: 22px; }
  #bar button:hover { background: var(--chip-h); filter: none; }
  body.dark #bar button { color: var(--text); }
  button.primary, #bar button.primary { background: var(--green); color: #fff; }
  button.danger { background: #e53935; color: #fff; }
  button.warn, #bar button.warn { background: #ffd23f; color: #3b2a00; font-weight: bold; border-color: #ffd23f; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  #updateBtn.warn { background: #ffffff; color: #00875f; border-color: #fff; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255,255,255,.35); } }
  #user { white-space: nowrap; font-size: 12px; color: rgba(255,255,255,.9); max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  #bar button { padding: 7px 11px; font-size: 13.5px; }
  @media (max-width: 1500px) { #user { display: none; } .tab { padding: 7px 12px; font-size: 14px; } }
  body.dark #user { color: var(--muted); }
  #views { position: absolute; top: 54px; bottom: 0; left: 0; right: 0; }
  body.has-pending #views { right: 260px; }
  #waitPanel { display: none; position: absolute; top: 54px; bottom: 0; right: 0; width: 260px; background: var(--panel2); border-left: 1px solid var(--line); overflow-y: auto; }
  body.has-pending #waitPanel { display: block; }
  #waitPanel h4 { margin: 0; padding: 12px 14px; font-size: 14px; background: linear-gradient(90deg, #25d366, #00a884); color: #fff; position: sticky; top: 0; z-index: 1; }
  #waitPanel ul { list-style: none; margin: 0; padding: 8px; }
  #waitPanel li { display: flex; align-items: center; gap: 8px; padding: 10px 10px; border-radius: 12px; cursor: pointer; margin-bottom: 7px; background: var(--panel); border-right: 5px solid #25d366; box-shadow: 0 2px 6px rgba(16,35,58,.07); transition: transform .1s; }
  #waitPanel li:hover { transform: translateX(-2px); }
  #waitPanel li.mid { border-right-color: #f9a825; }
  #waitPanel li.late { border-right-color: #e53935; }
  #waitPanel li .dot { width: 9px; height: 9px; border-radius: 50%; background: #25d366; flex: none; }
  #waitPanel li .t { flex: 1; min-width: 0; }
  #waitPanel li b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #waitPanel li small { font-size: 11px; color: var(--muted); }
  #waitPanel li .w { font-size: 11px; color: var(--muted); white-space: nowrap; font-weight: 600; }
  #waitPanel li.mid .w { color: #c77700; }
  #waitPanel li.late .w { color: #e53935; font-weight: bold; }
  webview { position: absolute; inset: 0; width: 100%; height: 100%; visibility: hidden; }
  webview.active { visibility: visible; }
  #empty { padding: 60px 20px; text-align: center; font-size: 18px; color: var(--muted); }
  #modal { display: none; position: fixed; inset: 0; background: rgba(16,35,58,.45); z-index: 10; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
  #modal.on { display: flex; }
  .box { background: var(--panel); color: var(--text); border-radius: 16px; padding: 22px; width: 500px; max-width: 92vw; max-height: 86vh; overflow: auto; box-shadow: 0 20px 50px rgba(16,35,58,.3); border-top: 5px solid #00a884; }
  .box h3 { margin: 0 0 14px; }
  .box h4 { margin: 18px 0 8px; font-size: 14px; color: #00875f; }
  body.dark .box h4 { color: #25d366; }
  .box input[type=text], .box input[type=password], .box select { width: 100%; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-size: 15px; font-family: inherit; }
  .box input[type=text] { margin-bottom: 14px; }
  .choice { display: block; padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
  .choice small { display: block; color: var(--muted); margin-top: 3px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .row select { flex: 1; width: auto; }
  .plist { list-style: none; padding: 0; margin: 0; }
  .plist li { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; background: var(--panel2); margin-bottom: 6px; border-right: 4px solid #25d366; }
  .plist li .dot { width: 10px; height: 10px; border-radius: 50%; background: #25d366; flex: none; }
  .plist li .n { flex: 1; cursor: pointer; font-weight: 600; }
  .plist li .acc { font-size: 12px; color: var(--muted); }
  .plist li button { padding: 4px 9px; font-size: 12px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: linear-gradient(90deg, #00a884, #3f6fe8); color: #fff; padding: 11px 20px; border-radius: 14px; display: none; z-index: 20; box-shadow: var(--shadow); font-weight: 600; }
</style>
</head>
<body>
<div id="bar">
  <div id="tabs"></div>
  <button id="add" title="הוסף וואטסאפ">+ הוסף</button>
  <div class="spacer"></div>
  <button id="updateBtn" class="warn" style="display:none"></button>
  <button id="pendingBtn" title="צ'אטים שמחכים לתשובה שלך">⏳ ממתינים לתשובה (0)</button>
  <button id="exclBtn" title="הצ'אט שפתוח עכשיו לא יסומן בירוק ולא יצלצל">🚫 החרג</button>
  <button id="toClaude" title="שולח את השיחה הפתוחה ל-Claude כדי לקבל הצעה לתשובה">🤖 שאל</button>
  <button id="mute">🔔</button>
  <button id="settings" title="הגדרות צלצול">⚙️</button>
  <button id="reload" title="רענון הלשונית">⟳</button>
  <span id="user"></span>
</div>
<div id="waitPanel"><h4>⏳ מחכים לתשובה (<span class="cnt">0</span>)</h4><ul></ul></div>
<div id="views"><div id="empty">אין עדיין חשבונות. לחץ "+ הוסף" כדי לחבר וואטסאפ.</div></div>
<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>
<script src="renderer.js"></script>
</body>
</html>
