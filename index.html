<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>WhatsApp Multi</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Segoe UI, Arial, sans-serif; background: #111b21; color: #e9edef; }
  #bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #202c33; height: 50px; }
  #tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex-shrink: 1; min-width: 0; }
  #tabs::-webkit-scrollbar { display: none; }
  #user { white-space: nowrap; }
  .tab { padding: 8px 14px; border-radius: 8px; cursor: pointer; background: #2a3942; user-select: none; font-size: 15px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tab.active { background: #00a884; color: #fff; }
  .tab.claude { background: #3d2f27; }
  .tab.claude.active { background: #d97757; }
  .badge { display: none; background: #25d366; color: #0b141a; border-radius: 10px; padding: 1px 7px; font-size: 12px; font-weight: bold; }
  .badge.on { display: inline-block; }
  .tab.active .badge { background: #fff; }
  .spacer { flex: 1; }
  button { background: #2a3942; color: #e9edef; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 14px; white-space: nowrap; }
  button:hover { background: #3b4a54; }
  button.primary { background: #00a884; color: #fff; }
  button.danger { background: #c62828; color: #fff; }
  button.warn { background: #25d366; color: #0b141a; font-weight: bold; }
  #user { font-size: 12px; opacity: .7; }
  #views { position: absolute; top: 50px; bottom: 0; left: 0; right: 0; }
  body.has-pending #views { right: 250px; }
  #waitPanel { display: none; position: absolute; top: 50px; bottom: 0; right: 0; width: 250px; background: #0b141a; border-left: 1px solid #2a3942; overflow-y: auto; }
  body.has-pending #waitPanel { display: block; }
  #waitPanel h4 { margin: 0; padding: 12px 14px; font-size: 14px; background: #25d366; color: #0b141a; position: sticky; top: 0; }
  #waitPanel ul { list-style: none; margin: 0; padding: 6px; }
  #waitPanel li { display: flex; align-items: center; gap: 8px; padding: 9px 8px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; background: #111b21; border-right: 4px solid #25d366; }
  #waitPanel li:hover { background: #202c33; }
  #waitPanel li.mid { border-right-color: #f9a825; }
  #waitPanel li.late { border-right-color: #e53935; }
  #waitPanel li .dot { width: 9px; height: 9px; border-radius: 50%; background: #25d366; flex: none; }
  #waitPanel li .t { flex: 1; min-width: 0; }
  #waitPanel li b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #waitPanel li small { font-size: 11px; opacity: .6; }
  #waitPanel li .w { font-size: 11px; opacity: .8; white-space: nowrap; }
  #waitPanel li.late .w { color: #ff6b6b; opacity: 1; font-weight: bold; }
  webview { position: absolute; inset: 0; width: 100%; height: 100%; visibility: hidden; }
  webview.active { visibility: visible; }
  #empty { padding: 40px; text-align: center; font-size: 18px; opacity: .8; }
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10; align-items: center; justify-content: center; }
  #modal.on { display: flex; }
  .box { background: #202c33; border-radius: 12px; padding: 22px; width: 480px; max-width: 92vw; max-height: 86vh; overflow: auto; }
  .box h3 { margin: 0 0 14px; }
  .box h4 { margin: 16px 0 8px; font-size: 14px; opacity: .85; }
  .box input[type=text], .box select { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #3b4a54; background: #111b21; color: #e9edef; font-size: 15px; }
  .box input[type=text] { margin-bottom: 14px; }
  .choice { display: block; padding: 10px; border: 1px solid #3b4a54; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
  .choice small { display: block; opacity: .7; margin-top: 3px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .row select { flex: 1; width: auto; }
  .plist { list-style: none; padding: 0; margin: 0; }
  .plist li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; background: #111b21; margin-bottom: 6px; }
  .plist li .dot { width: 10px; height: 10px; border-radius: 50%; background: #25d366; flex: none; }
  .plist li .n { flex: 1; cursor: pointer; }
  .plist li .acc { font-size: 12px; opacity: .6; }
  .plist li button { padding: 4px 9px; font-size: 12px; }
  .hint { font-size: 12px; opacity: .65; margin-top: 6px; line-height: 1.5; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #00a884; color: #fff; padding: 10px 18px; border-radius: 10px; display: none; z-index: 20; }
</style>
</head>
<body>
<div id="bar">
  <div id="tabs"></div>
  <button id="add" title="הוסף וואטסאפ">+ הוסף</button>
  <div class="spacer"></div>
  <button id="updateBtn" class="warn" style="display:none"></button>
  <button id="pendingBtn" title="צ'אטים שמחכים לתשובה שלך">⏳ ממתינים לתשובה (0)</button>
  <button id="exclBtn" title="הצ'אט שפתוח עכשיו לא יסומן בירוק ולא יצלצל">🚫 החרג</button>
  <button id="toClaude" title="שולח את השיחה הפתוחה ל-Claude כדי לקבל הצעה לתשובה">🤖 שאל</button>
  <button id="mute">🔔</button>
  <button id="settings" title="הגדרות צלצול">⚙️</button>
  <button id="reload" title="רענון הלשונית">⟳</button>
  <span id="user"></span>
</div>
<div id="waitPanel"><h4>⏳ מחכים לתשובה (<span class="cnt">0</span>)</h4><ul></ul></div>
<div id="views"><div id="empty">אין עדיין חשבונות. לחץ "+ הוסף" כדי לחבר וואטסאפ.</div></div>
<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>
<script src="renderer.js"></script>
</body>
</html>
